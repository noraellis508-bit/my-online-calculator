
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Calculator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #f4f7fb;
  font-family: Arial, sans-serif;
  color: #253047;
}
.calculator {
  width: 100%;
  max-width: 360px;
  padding: 24px;
  background: white;
  border: 1px solid #e5eaf1;
  border-radius: 22px;
  box-shadow: 0 12px 35px #25304712;
}
h1 { font-size: 23px; text-align: center; }
#display {
  width: 100%;
  height: 80px;
  margin: 12px 0 18px;
  padding: 15px;
  border: 1px solid #e5eaf1;
  border-radius: 12px;
  background: #f8fafc;
  text-align: right;
  font-size: 32px;
  color: #253047;
  overflow: hidden;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button {
  min-height: 58px;
  border: none;
  border-radius: 12px;
  background: #edf2f8;
  color: #253047;
  font-size: 20px;
  cursor: pointer;
}
button:active { transform: scale(.96); }
button:hover { background: #e0e9f5; }
.operator { background: #dceaff; color: #1759b5; }
.clear { background: #ffe9e9; color: #c03939; }
.equal { background: #2864df; color: white; }
.equal:hover { background: #1d50bd; }
footer {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: #7b8798;
}
</style>
</head>
<body>
<main class="calculator">
  <h1>Online Calculator</h1>
  <div id="display" aria-live="polite">0</div>
  <div class="buttons">
    <button class="clear" onclick="resetCalc()">AC</button>
    <button onclick="backspace()">DEL</button>
    <button class="operator" onclick="percent()">%</button>
    <button class="operator" onclick="choose('/')">÷</button>

    <button onclick="digit('7')">7</button>
    <button onclick="digit('8')">8</button>
    <button onclick="digit('9')">9</button>
    <button class="operator" onclick="choose('*')">×</button>

    <button onclick="digit('4')">4</button>
    <button onclick="digit('5')">5</button>
    <button onclick="digit('6')">6</button>
    <button class="operator" onclick="choose('-')">−</button>

    <button onclick="digit('1')">1</button>
    <button onclick="digit('2')">2</button>
    <button onclick="digit('3')">3</button>
    <button class="operator" onclick="choose('+')">+</button>

    <button onclick="digit('0')">0</button>
    <button onclick="decimal()">.</button>
    <button onclick="toggleSign()">+/−</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
  <footer>Simple • Fast • Free</footer>
</main>

<script>
const display = document.getElementById('display');
let current = '0';
let previous = null;
let operator = null;
let fresh = false;

function show() {
  display.textContent = current;
}

function digit(n) {
  if (fresh || current === 'Error') {
    current = n;
    fresh = false;
  } else if (current === '0') {
    current = n;
  } else if (current.replace('-', '').length < 14) {
    current += n;
  }
  show();
}

function decimal() {
  if (fresh || current === 'Error') {
    current = '0.';
    fresh = false;
  } else if (!current.includes('.')) {
    current += '.';
  }
  show();
}

function resetCalc() {
  current = '0';
  previous = null;
  operator = null;
  fresh = false;
  show();
}

function backspace() {
  if (fresh || current === 'Error') {
    current = '0';
    fresh = false;
  } else {
    current = current.length > 1
      ? current.slice(0, -1) : '0';
    if (current === '-') current = '0';
  }
  show();
}

function toggleSign() {
  if (current !== '0' && current !== 'Error') {
    current = String(-Number(current));
  }
  show();
}

function percent() {
  if (current !== 'Error') {
    current = String(Number(current) / 100);
    fresh = true;
  }
  show();
}

function calculate() {
  if (operator === null || previous === null) return;
  const a = previous;
  const b = Number(current);
  let result;

  if (operator === '+') result = a + b;
  if (operator === '-') result = a - b;
  if (operator === '*') result = a * b;
  if (operator === '/') {
    if (b === 0) {
      current = 'Error';
      previous = null;
      operator = null;
      fresh = true;
      show();
      return;
    }
    result = a / b;
  }

  current = String(Number(result.toPrecision(12)));
  previous = null;
  operator = null;
  fresh = true;
  show();
}

function choose(op) {
  if (current === 'Error') return;
  if (operator !== null && !fresh) calculate();
  previous = Number(current);
  operator = op;
  fresh = true;
}

document.addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) digit(e.key);
  else if (e.key === '.') decimal();
  else if (['+', '-', '*', '/'].includes(e.key)) choose(e.key);
  else if (e.key === 'Enter' || e.key === '=') calculate();
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') resetCalc();
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
