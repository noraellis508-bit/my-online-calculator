
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8ff">
  <meta name="description" content="A free, modern online calculator for everyday calculations.">
  <title>NovaCalc - Free Online Calculator</title>

  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #202b43;
      --muted: #8994a8;
      --line: #e8edf5;
      --button: #f1f5fb;
      --blue: #3569e8;
      --blue-light: #eaf0ff;
      --shadow: 0 20px 60px rgba(43, 68, 112, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top left, #e9f0ff 0, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    .page { width: 100%; max-width: 430px; }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, #4d82f5, #2854d7);
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 6px 16px #3569e83b;
    }

    .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.7px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .calculator {
      overflow: hidden;
      padding: 24px;
      border: 1px solid #ffffff;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar strong { font-size: 14px; }
    .status { color: #278b63; font-size: 11px; }
    .status::before { content: "●"; margin-right: 6px; }

    .screen {
      min-width: 0;
      padding: 16px 4px 22px;
      text-align: right;
    }

    #expression {
      min-height: 24px;
      color: var(--muted);
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    #display {
      margin-top: 8px;
      min-height: 58px;
      font-size: clamp(35px, 10vw, 48px);
      font-weight: 650;
      letter-spacing: -1.8px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-width: 0;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      background: var(--button);
      color: var(--text);
      font: inherit;
      font-size: 19px;
      font-weight: 550;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #e6edf8; }
    button:active { transform: scale(.96); }
    button:focus-visible {
      outline: 3px solid #8caeff;
      outline-offset: 2px;
    }

    .utility {
      background: #f0f3f9;
      color: #68758d;
      font-size: 15px;
    }

    .operator { background: var(--blue-light); color: var(--blue); }
    .operator.active { background: #d6e3ff; }
    .operator:hover { background: #dbe6ff; }
    .equals {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 6px 15px #3569e832;
    }
    .equals:hover { background: #2857ce; }
    .zero { grid-column: span 2; }

    .history {
      margin-top: 24px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-head h2 { margin: 0; font-size: 13px; }

    .text-button {
      min-height: 30px;
      padding: 5px 9px;
      background: transparent;
      color: var(--blue);
      font-size: 12px;
    }

    .text-button:hover { background: var(--blue-light); }

    #history-list {
      display: grid;
      gap: 7px;
      max-height: 150px;
      overflow: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f8faff;
      text-align: left;
      cursor: pointer;
    }

    .history-item:hover { background: var(--blue-light); }
    .history-expression { color: var(--muted); font-size: 11px; }
    .history-result { font-size: 14px; font-weight: 650; }
    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }

    footer {
      margin: 19px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      body { padding: 18px 10px; }
      .calculator { padding: 17px; border-radius: 22px; }
      .keypad { gap: 8px; }
      button { min-height: 53px; border-radius: 13px; }
      #display { font-size: 35px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">÷</div>
      <div>
        <h1>NovaCalc</h1>
        <p>Simple math. Clear answers.</p>
      </div>
    </header>

    <section class="calculator" aria-label="Online calculator">
      <div class="topbar">
        <strong>Calculator</strong>
        <span class="status">Ready to calculate</span>
      </div>

      <div class="screen" aria-live="polite">
        <div id="expression">Your calculation</div>
        <div id="display">0</div>
      </div>

      <div class="keypad" id="keypad">
        <button class="utility" data-action="clear" aria-label="Clear all">AC</button>
        <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-op="/" aria-label="Divide">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-op="*" aria-label="Multiply">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-op="-" aria-label="Subtract">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="operator" data-op="+" aria-label="Add">+</button>

        <button class="zero" data-digit="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals" aria-label="Calculate result">=</button>
      </div>

      <section class="history" aria-label="Recent calculations">
        <div class="history-head">
          <h2>Recent calculations</h2>
          <button class="text-button" data-action="clear-history">Clear history</button>
        </div>
        <div id="history-list">
          <div class="empty">Your calculations will appear here.</div>
        </div>
      </section>
    </section>

    <footer>Free online calculator · Works on mobile, tablet and desktop</footer>
  </main>

  <script>
    const display = document.getElementById("display");
    const expression = document.getElementById("expression");
    const keypad = document.getElementById("keypad");
    const historyList = document.getElementById("history-list");

    let current = "0";
    let previous = null;
    let operator = null;
    let fresh = false;
    let error = false;
    let history = [];

    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function format(value) {
      if (!Number.isFinite(value)) return "Error";
      if (Math.abs(value) >= 1e14 || (value !== 0 && Math.abs(value) < 1e-7)) {
        return value.toExponential(6);
      }
      return String(Number(value.toPrecision(12)));
    }

    function render() {
      display.textContent = current;
      keypad.querySelectorAll("[data-op]").forEach(button => {
        button.classList.toggle("active", button.dataset.op === operator);
      });
    }

    function reset() {
      current = "0";
      previous = null;
      operator = null;
      fresh = false;
      error = false;
      expression.textContent = "Your calculation";
      render();
    }

    function digit(value) {
      if (error || fresh) {
        current = value;
        error = false;
        fresh = false;
      } else if (current === "0") {
        current = value;
      } else if (current.replace("-", "").replace(".", "").length < 14) {
        current += value;
      }
      render();
    }

    function decimal() {
      if (error || fresh) {
        current = "0.";
        error = false;
        fresh = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      render();
    }

    function deleteLast() {
      if (error || fresh) {
        current = "0";
        error = false;
        fresh = false;
      } else {
        current = current.length > 1 ? current.slice(0, -1) : "0";
        if (current === "-") current = "0";
      }
      render();
    }

    function percent() {
      if (error) return;
      current = format(Number(current) / 100);
      fresh = true;
      render();
    }

    function compute(a, b, op) {
      if (op === "+") return a + b;
      if (op === "-") return a - b;
      if (op === "*") return a * b;
      if (op === "/") return b === 0 ? null : a / b;
      return null;
    }

    function equals() {
      if (error || operator === null || previous === null || fresh) return;

      const a = previous;
      const b = Number(current);
      const op = operator;
      const result = compute(a, b, op);
      const line = format(a) + " " + symbols[op] + " " + format(b);

      if (result === null || !Number.isFinite(result)) {
        current = "Cannot divide by zero";
        error = true;
      } else {
        current = format(result);
        history.unshift({ line, result: current });
        history = history.slice(0, 10);
        renderHistory();
      }

      expression.textContent = line + " =";
      previous = null;
      operator = null;
      fresh = true;
      render();
    }

    function choose(op) {
      if (error) return;

      if (operator !== null && !fresh) {
        const result = compute(previous, Number(current), operator);
        if (result === null || !Number.isFinite(result)) {
          current = "Cannot divide by zero";
          error = true;
          previous = null;
          operator = null;
          render();
          return;
        }
        current = format(result);
      }

      previous = Number(current);
      operator = op;
      fresh = true;
      expression.textContent = format(previous) + " " + symbols[op];
      render();
    }

    function renderHistory() {
      historyList.replaceChildren();

      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Your calculations will appear here.";
        historyList.appendChild(empty);
        return;
      }

      history.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", "Use result " + item.result);

        const left = document.createElement("span");
        left.className = "history-expression";
        left.textContent = item.line;

        const right = document.createElement("span");
        right.className = "history-result";
        right.textContent = item.result;

        row.append(left, right);

        function useResult() {
          current = item.result;
          previous = null;
          operator = null;
          fresh = true;
          error = false;
          expression.textContent = "Previous result";
          render();
        }

        row.addEventListener("click", useResult);
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            useResult();
          }
        });
        historyList.appendChild(row);
      });
    }

    keypad.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.digit !== undefined) digit(button.dataset.digit);
      else if (button.dataset.op) choose(button.dataset.op);
      else {
        switch (button.dataset.action) {
          case "clear": reset(); break;
          case "delete": deleteLast(); break;
          case "decimal": decimal(); break;
          case "percent": percent(); break;
          case "equals": equals(); break;
          case "clear-history":
            history = [];
            renderHistory();
            break;
        }
      }
    });

    document.addEventListener("keydown", event => {
      if (/^[0-9]$/.test(event.key)) digit(event.key);
      else if (event.key === ".") decimal();
      else if (["+", "-", "*", "/"].includes(event.key)) choose(event.key);
      else if (event.key === "Enter" || event.key === "=") equals();
      else if (event.key === "Backspace") deleteLast();
      else if (event.key === "Escape") reset();
      else if (event.key === "%") percent();
      else return;

      event.preventDefault();
    });

    render();
  </script>
</body>
</html>
